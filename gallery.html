<div class="full-wrap">
  <div class="page-header">
    <h1>Gallery</h1>
    <p>Photos &amp; videos — life, fieldwork, and conferences</p>
  </div>

  <!-- 类型筛选（照片/视频）-->
  <div class="gal-tabs-row">
    <span class="gal-tab-label">Type</span>
    <div class="gal-tab active" data-filter-key="type" data-filter-val="all" onclick="setTypeFilter('all', this)">
      All <span class="gal-tab-count" id="count-type-all"></span>
    </div>
    <div class="gal-tab" data-filter-key="type" data-filter-val="photo" onclick="setTypeFilter('photo', this)">
      📷 Photos <span class="gal-tab-count" id="count-type-photo"></span>
    </div>
    <div class="gal-tab" data-filter-key="type" data-filter-val="video" onclick="setTypeFilter('video', this)">
      🎬 Videos <span class="gal-tab-count" id="count-type-video"></span>
    </div>
  </div>

  <!-- 来源筛选（本地/Drive）-->
  <div class="gal-tabs-row">
    <span class="gal-tab-label">Source</span>
    <div class="gal-tab active" data-filter-key="source" data-filter-val="all" onclick="setSourceFilter('all', this)">
      All Sources <span class="gal-tab-count" id="count-source-all"></span>
    </div>
    <div class="gal-tab" data-filter-key="source" data-filter-val="local" onclick="setSourceFilter('local', this)">
      💾 Local <span class="gal-tab-count" id="count-source-local"></span>
    </div>
    <div class="gal-tab" data-filter-key="source" data-filter-val="drive" onclick="setSourceFilter('drive', this)">
      ☁️ Google Drive <span class="gal-tab-count" id="count-source-drive"></span>
    </div>
  </div>

  <div class="gal-grid" id="galGrid"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <div id="lightboxBody"></div>
</div>

<footer>

</footer>

<script src="assets/js/data/gallery.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
  /* 当前筛选状态 */
  const currentFilters = { type: 'all', source: 'all' };

  /* 初始化：计算数量并填入 Tab 徽章 */
  (function initCounts(){
    const counts = getGalleryCounts(galleryData);
    document.getElementById('count-type-all').textContent   = counts.all;
    document.getElementById('count-type-photo').textContent = counts.photo;
    document.getElementById('count-type-video').textContent = counts.video;
    document.getElementById('count-source-all').textContent   = counts.all;
    document.getElementById('count-source-local').textContent = counts.local;
    document.getElementById('count-source-drive').textContent = counts.drive;
  })();

  /* 首次渲染：全部显示 */
  renderGallery('galGrid', galleryData, currentFilters);

  /* 类型 Tab 点击 */
  function setTypeFilter(type, btn){
    currentFilters.type = type;
    document.querySelectorAll('.gal-tab[data-filter-key="type"]').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderGallery('galGrid', galleryData, currentFilters);
  }

  /* 来源 Tab 点击 */
  function setSourceFilter(source, btn){
    currentFilters.source = source;
    document.querySelectorAll('.gal-tab[data-filter-key="source"]').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderGallery('galGrid', galleryData, currentFilters);
  }
</script>
</body>
</html>
