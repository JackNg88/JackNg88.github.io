name: Build Tutorials from Markdown

on:
  push:
    branches: [main]
    paths:
      - "tutorials-src/**.md"
      - "scripts/build_tutorials.py"
      - "tutorials/template.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build tutorials from Markdown
        run: python scripts/build_tutorials.py

      - name: Commit generated files (if any changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tutorials/*.html assets/js/data/tutorials.js
          git diff --cached --quiet || git commit -m "chore: auto-build tutorials from Markdown [skip ci]"
          git push
